<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register || User</title>
    <link rel="stylesheet" href="/practice/static/style.css"
</head>
<body>
<form method="post" action="/login">
    <h1>Register PAGE</h1>
    Username: <input type="text" name="name" placeholder="Enter your name"><br><br>
    Email: <input type="text" name="email" placeholder="Enter your email"><br><br>
    Password: <input type="password" name="password" placeholder="Enter your password"><br><br>
    Confirm Password: <input type="password" name="cpassword" placeholder="Enter your password"><br>
    <p>Already have account ? Login here <a href="login.html">Login</a></p>
    <input type="submit" value="submit">
    <p>{{message}}</p>
</form>

</body>
</html>
