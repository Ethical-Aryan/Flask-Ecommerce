<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - E-Commerce Store</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="d-flex justify-content-center align-items-center vh-100 bg-dark position-relative overflow-hidden">

    <!-- Background Accent Glow -->
    <div style="position: absolute; top: -10%; right: -10%; width: 450px; height: 450px; background: radial-gradient(circle, rgba(79, 70, 229, 0.3) 0%, transparent 70%); border-radius: 50%;"></div>
    <div style="position: absolute; bottom: -10%; left: -10%; width: 450px; height: 450px; background: radial-gradient(circle, rgba(6, 182, 212, 0.25) 0%, transparent 70%); border-radius: 50%;"></div>

    <div class="card border-0 shadow-lg rounded-4 p-4 text-white position-relative" style="width: 380px; background: rgba(30, 41, 59, 0.95); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1) !important;">
        <div class="text-center mb-4">
            <div class="stat-icon bg-primary-subtle text-primary mx-auto mb-3" style="width: 64px; height: 64px; border-radius: 16px;">
                <i class="bi bi-shield-lock-fill fs-2"></i>
            </div>
            <h4 class="fw-bold mb-1">Admin Portal</h4>
            <p class="text-secondary small mb-0">Sign in to manage store catalog and categories</p>
        </div>

        {% if error %}
            <div class="alert alert-danger py-2 text-center small rounded-3 mb-3 border-0">
                <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ error }}
            </div>
        {% endif %}

        <form action="/adminlogin" method="POST">
            <div class="mb-3">
                <label class="form-label text-light small fw-semibold">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-person"></i></span>
                    <input type="text" name="username" class="form-control bg-dark text-white border-secondary" placeholder="Enter admin username" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label text-light small fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-key"></i></span>
                    <input type="password" name="password" class="form-control bg-dark text-white border-secondary" placeholder="Enter password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 py-2 rounded-pill fw-semibold mb-3">
                <i class="bi bi-box-arrow-in-right me-1"></i> Login to Dashboard
            </button>
        </form>

        <div class="text-center pt-2 border-top border-secondary border-opacity-25">
            <a href="{{ url_for('index') }}" class="text-secondary text-decoration-none small">
                &larr; Back to Storefront
            </a>
        </div>
    </div>

</body>
</html>
