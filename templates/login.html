<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | E-Shop Store</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="container-fluid">
    <div class="row min-vh-100 justify-content-center align-items-center">
        <div class="col-lg-4 col-md-6 col-sm-10">
            <div class="login-card">
                <h2>E-Shop Store</h2>
                <p>Welcome Back</p>

                {% if error %}
                    <div class="alert alert-danger py-2 text-center small rounded-3 mb-3">
                        {{ error }}
                    </div>
                {% endif %}
                {% if mess %}
                    <div class="alert alert-success py-2 text-center small rounded-3 mb-3">
                        {{ mess }}
                    </div>
                {% endif %}

                <form method="POST" action="/login">
                    <div class="mb-3">
                        <label class="form-label text-light small">Email Address</label>
                        <input type="email" class="form-control" placeholder="Enter your email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-light small">Password</label>
                        <input type="password" class="form-control" placeholder="Enter password" name="password" required>
                    </div>
                    <button type="submit" class="btn login-btn w-100 mt-2">Login</button>
                </form>

                <div class="text-center mt-4">
                    <span>Don't have an account?</span>
                    <a href="/register">Register</a>
                </div>

                <div class="text-center mt-3">
                    <a href="{{ url_for('index') }}" class="text-muted small">&larr; Back to Storefront</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
