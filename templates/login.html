<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Sign In | E-SHOP</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">

    {% include 'navbar.html' %}

    <main class="d-flex align-items-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5 col-xl-4">
                    <div class="card border-0 shadow-sm rounded-4 p-4 p-sm-5 bg-white">
                        <div class="text-center mb-4">
                            <div class="brand-icon-box mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.4rem;">
                                <i class="bi bi-person-fill"></i>
                            </div>
                            <h3 class="fw-bold mb-1 text-dark">Welcome Back</h3>
                            <p class="text-muted small">Sign in to your customer account</p>
                        </div>

                        {% if error %}
                            <div class="alert alert-danger py-2 small rounded-3 mb-3 text-center">
                                <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ error }}
                            </div>
                        {% endif %}
                        {% if mess %}
                            <div class="alert alert-success py-2 small rounded-3 mb-3 text-center">
                                <i class="bi bi-check-circle-fill me-1"></i> {{ mess }}
                            </div>
                        {% endif %}

                        <form method="POST" action="/login">
                            <div class="mb-3">
                                <label class="form-label small fw-semibold text-secondary">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                                    <input type="email" class="form-control bg-light border-start-0" placeholder="name@example.com" name="email" required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label small fw-semibold text-secondary">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                                    <input type="password" class="form-control bg-light border-start-0" placeholder="••••••••" name="password" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary-custom w-100 py-2 fw-semibold">Sign In</button>
                        </form>

                        <div class="text-center mt-4 pt-3 border-top border-light small text-muted">
                            Don't have an account? <a href="{{ url_for('register') }}" class="text-primary fw-bold text-decoration-none">Create one</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    {% include 'cart_modal.html' %}
    {% include 'footer.html' %}

    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/cart.js') }}"></script>
</body>
</html>
